#
# Schema that's ahead of the gateway: read after schema.graphql, the pinned copy, so the clients
# can be built against it before steward-gateway ships it. It holds the shape proposed in
# https://github.com/Steward-GRC/steward-gateway/issues/41 (policy text search), and each part
# goes once the pinned gateway SDL carries it.

extend type Mutation {
  # Site admin only: removes the appendix and its history.
  deleteAppendixForever(id: ID!): Boolean!
}

# An n-of-m stage quorum, as steward-workflow's builder keeps it: quorum "nofm" with quorumN, the
# approvals the stage needs. quorumN is zero on every other quorum. Not on steward-workflow's API
# yet (its stage quorum there is one, majority or all).
extend type WorkflowStageDef {
  quorumN: Int!
}

extend input WorkflowStageInput {
  quorumN: Int
}


# A veto holder: a stage names the people, in vetoUserIds, whose single reject ends the version as
# rejected even inside a quorum and below its threshold. There is no workflow-wide switch: a stage
# with a non-empty list applies it. A vetoer must be one of the stage's approvers (the pool after
# the access filter); there are no veto-only seats, and site admin or root does not count. Saving
# a stage whose vetoUserIds names someone who is in none of its explicit approver lists
# (approvers, approversByCategory, group members) is refused with InvalidArgument; for a pool
# derived from the policy's category or from a group, a vetoer who is not seated at submit holds
# no veto. StageAssignee.veto marks the seats that hold one. Proposed in the steward-workflow
# veto model change (steward-mock-server#223).
#
# Deprecated, to go once steward-web has moved (the pinned SDL above still declares them):
# WorkflowStageDef.vetoApproverIds and vetoGroupIds (the mock answers []), the same two on
# WorkflowStageInput (accepted and ignored), WorkflowDef.vetoEnabled and setWorkflowVetoEnabled
# (the flag is stored and gates nothing).
extend type WorkflowStageDef {
  vetoUserIds: [ID!]!
}

extend input WorkflowStageInput {
  vetoUserIds: [ID!]
}
