#
# Schema that's ahead of the gateway: read after schema.graphql, the pinned copy, so the clients
# can be built against it before steward-gateway ships it. It holds the shape proposed in
# https://github.com/Steward-GRC/steward-gateway/issues/41 (policy text search), and each part
# goes once the pinned gateway SDL carries it.

# Moving several documents at once, proposed in
# https://github.com/Steward-GRC/steward-gateway/issues/82 (steward-core#35). All or nothing; site
# admins only. The preview changes nothing.
extend type Query {
  previewMovePolicies(policyIds: [ID!]!, homeCategoryId: ID!): MovePoliciesPreview!
}

extend type Mutation {
  movePolicies(policyIds: [ID!]!, homeCategoryId: ID!): MovePoliciesResult!
}

type MovePoliciesPreview {
  items: [MovePolicyItem!]!
}

type MovePoliciesResult {
  moved: [MovePolicyItem!]!
}

type MovePolicyItem {
  policyId: ID!
  title: String!
  number: String!
  # The number in the target's sequence; null when it cannot move.
  newNumber: String
  # Why it cannot move; null when it can.
  refusal: String
}

# What a category holds, proposed in https://github.com/Steward-GRC/steward-gateway/issues/80
# (steward-core#34 stores it). BOTH is the default. NONE makes the category a container that only
# holds child categories. Creating a draft in a category, and moving a document into one, is
# refused (CATEGORY_REFUSES_TYPE) when the category does not accept the type. Narrowing is
# refused (CATEGORY_HOLDS_DOCUMENTS, with the count in the message) while documents the
# category would no longer accept are in it, published or draft.
enum CategoryDocumentTypes {
  BOTH
  POLICIES
  PROCEDURES
  NONE
}

extend type Category {
  documentTypes: CategoryDocumentTypes!
  # Authors creating under this category (or one that inherits its template) must use the default
  # template: freeform and any other template are refused. Proposed in steward-gateway#88.
  defaultTemplateLocked: Boolean!
}

extend type Mutation {
  # Site admin only. The category must name a default template to lock.
  setCategoryTemplateLock(id: ID!, locked: Boolean!): Category!
}

extend type Query {
  # How many documents a category holds now, for the settings form's check before it narrows.
  categoryDocumentCounts(categoryId: ID!): CategoryDocumentCounts!
}

type CategoryDocumentCounts {
  policies: Int!
  procedures: Int!
}

extend type Mutation {
  # Site admin only. Widening always works; narrowing is refused while the category holds
  # documents it would no longer accept.
  setCategoryDocumentTypes(id: ID!, documentTypes: CategoryDocumentTypes!): Category!
}

extend type Query {
  # searchPolicies -> core's search RPC over published policy text, filtered by the reader's read
  #   decision (steward-authz). A policy the viewer can't read never appears. A viewer whose
  #   content is obfuscated matches on title and number only and gets no snippet. Drafts and
  #   retired policies never match. documentType: null searches both kinds. first: page size
  #   (default 20, at most 100). after: the nextPageToken of the page before.
  searchPolicies(query: String!, documentType: DocumentType, first: Int, after: String): PolicySearchPage!
}

# One page of hits, best first, paged like AuditQueryPage and UserPage.
type PolicySearchPage {
  hits: [PolicySearchHit!]!
  # Opaque; pass as `after` for the next page. Empty on the last page.
  nextPageToken: String!
}

type PolicySearchHit {
  policy: Policy!
  # Higher is better. Only comparable within one search's results.
  rank: Float!
  # Null when the match is in the title or number only, or the viewer's content is obfuscated.
  snippet: PolicySearchSnippet
}

# A passage of the published text, plain (no markup), and where the query matched in it. A long
# passage is cut to a window around its first match, with an ellipsis (…) at a cut end.
type PolicySearchSnippet {
  text: String!
  matches: [TextSpan!]!
}

# A run of `text`, counted in UTF-16 code units, as JavaScript, NSString and Kotlin index strings.
type TextSpan {
  start: Int!
  length: Int!
}

# The appendix life cycle. An appendix belongs to a policy or procedure, not to one of its
# versions, and has a life of its own: create -> draft, publish -> the version readers see, edit ->
# a new draft beside it, retire (kept and restorable), and only a site admin deletes one for good.
# Every version of a policy shows the latest published appendices. Appendices are not policy: they
# take no part in an approval and nobody comments on them. Publishing is for authors; the diff of
# a draft against the published row is for authors, site admins and compliance only.
enum AppendixState {
  DRAFT
  PUBLISHED
}

# Someone who saved or published an appendix. Former staff stay listed, with active false.
type AppendixContributor {
  userId: ID!
  name: String!
  active: Boolean!
}

# One row of an appendix's own version table (not a policy version).
type AppendixVersion {
  # Everyone who saved or published this row. Authors, site admins and compliance only; empty
  # for anyone else.
  contributors: [AppendixContributor!]!
  id: ID!
  versionNo: Int!
  state: AppendixState!
  title: String!
  contentJson: String!
  createdAt: String!
  createdBy: ID!
  updatedAt: String!
  updatedBy: ID!
  publishedAt: String
  publishedBy: ID
}

type PolicyAppendix {
  id: ID!
  policyId: ID!
  # The place among the live appendices (A, B, C); null while retired.
  letter: String
  orderIndex: Int!
  createdAt: String!
  createdBy: ID!
  retiredAt: String
  retiredBy: ID
  # The latest published row. Readers see only this.
  published: AppendixVersion
  # The author's work in progress; editors only.
  draft: AppendixVersion
  versions: [AppendixVersion!]!
  # The published rows, latest first, for the Published tab drop-down. Readers get the latest only.
  publishedVersions: [AppendixVersion!]!
  # Everyone who ever saved or published the appendix, active or not, in the order they first did.
  # Authors, site admins and compliance only; empty for anyone else.
  contributors: [AppendixContributor!]!
}

extend type Query {
  # Readers get the live appendices that have a published row; editors also the drafts, and the
  # retired ones with includeRetired.
  policyAppendices(policyId: ID!, includeRetired: Boolean): [PolicyAppendix!]!
  policyAppendix(id: ID!): PolicyAppendix!
  # The draft against what is published. Authors, site admins and compliance only. With
  # contentJson the given text (not saved) is diffed instead of the stored draft, so the diff can
  # follow what the author is typing.
  appendixDiff(id: ID!, contentJson: String): [SectionDiff!]!
}

extend type Mutation {
  # A blank or missing title becomes "Appendix A", "Appendix B", ...: the next name no other
  # appendix of the policy uses.
  createPolicyAppendix(policyId: ID!, title: String, contentJson: String!): PolicyAppendix!
  saveAppendixDraft(id: ID!, title: String!, contentJson: String!): PolicyAppendix!
  publishAppendix(id: ID!): PolicyAppendix!
  retireAppendix(id: ID!): PolicyAppendix!
  restoreAppendix(id: ID!): PolicyAppendix!
  # Site admin only: removes the appendix and its history.
  deleteAppendixForever(id: ID!): Boolean!
  reorderPolicyAppendices(policyId: ID!, orderedIds: [ID!]!): [PolicyAppendix!]!
}

# A veto approver: a workflow can opt in (off by default) to marking approvers on a stage, as users
# or as the members of a group seat, whose single reject ends the version as rejected even inside a
# quorum and below its threshold. Proposed in steward-workflow#26.
extend type WorkflowDef {
  vetoEnabled: Boolean!
}

extend type WorkflowStageDef {
  vetoApproverIds: [ID!]!
  vetoGroupIds: [ID!]!
}

extend input WorkflowStageInput {
  vetoApproverIds: [ID!]
  vetoGroupIds: [ID!]
}

extend type StageAssignee {
  # The seat holds a veto on its stage.
  veto: Boolean!
}

extend type Mutation {
  # Template admins and above.
  setWorkflowVetoEnabled(id: ID!, enabled: Boolean!): WorkflowDef!
}

# An n-of-m stage quorum, as steward-workflow's builder keeps it: quorum "nofm" with quorumN, the
# approvals the stage needs. quorumN is zero on every other quorum. Not on steward-workflow's API
# yet (its stage quorum there is one, majority or all).
extend type WorkflowStageDef {
  quorumN: Int!
}

extend input WorkflowStageInput {
  quorumN: Int
}

# Live co-editing inside an appendix: its own room and token, away from the policy's draft. Whoever
# may edit the policy may join; a checkpoint becomes the appendix's draft.
type AppendixCollabToken {
  token: String!
  wsUrl: String!
  expiresAt: String!
}

extend type Mutation {
  issueAppendixCollabToken(appendixId: ID!): AppendixCollabToken!
}

# What a policy or procedure VERSION links to from the libraries. The library items (definitions,
# references, contacts) are not versioned; the links are stored with the version, so they are
# approved with it, stay as approved once it is published, and are copied into a new draft. A link
# can only be added, removed or reordered while the version is editable (a draft, one in review or
# a withdrawn one); otherwise the call is refused with FAILED_PRECONDITION. Linking never creates a
# draft. Definitions are listed alphabetically by title; references and contacts keep the order the
# author gave them. Related items are other policies, each with a relationship type.
type RelationshipTypeInfo {
  id: ID!
  # How this side reads, for example "is related to".
  label: String!
  # The type the other side of the link takes, and how it reads ("is related by").
  inverseId: ID!
  inverseLabel: String!
}

enum RelatedDirection {
  # This version names the other policy.
  OUTGOING
  # The other policy's published version names this one; type and label are the inverse.
  INCOMING
}

type RelatedLink {
  policyId: ID!
  number: String!
  title: String!
  type: ID!
  label: String!
  direction: RelatedDirection!
}

input RelatedLinkInput {
  policyId: ID!
  type: ID!
}

type PolicyVersionLinks {
  policyVersionId: ID!
  # Whether the caller can change the links now.
  editable: Boolean!
  definitions: [DefinitionEntry!]!
  related: [RelatedLink!]!
  references: [Reference!]!
  contacts: [ContactBlock!]!
}

extend type Query {
  # The fixed list of relationship types, each with its inverse.
  relationshipTypes: [RelationshipTypeInfo!]!
  policyVersionLinks(policyVersionId: ID!): PolicyVersionLinks!
}

extend type Mutation {
  # Each is a full replace of that kind of link on the version. Authors only.
  setVersionDefinitions(policyVersionId: ID!, definitionIds: [ID!]!): PolicyVersionLinks!
  setVersionRelated(policyVersionId: ID!, links: [RelatedLinkInput!]!): PolicyVersionLinks!
  # The order given is the order kept.
  setVersionReferences(policyVersionId: ID!, referenceIds: [ID!]!): PolicyVersionLinks!
  setVersionContacts(policyVersionId: ID!, contactBlockIds: [ID!]!): PolicyVersionLinks!
}

# Who submitted the run and when, and each stage's due date and rule, proposed in
# steward-gateway#68 (steward-workflow#49 sends them). stageProgress is index-aligned with
# stageNames. approvals and required count individual seats only; approve-as-group units keep
# their own tally in stageUnitProgress. This goes once the pinned gateway SDL carries them.
extend type WorkflowStatus {
  # The user who submitted the run (the account acted as, during act-as).
  submittedBy: String
  submittedAt: String
  stageProgress: [StageProgress!]!
}

type StageProgress {
  # The earliest due date among the stage's live seats; null until the stage is entered.
  dueAt: String
  # one, majority, all or nofm.
  quorum: String!
  # The approvals an nofm stage needs; 0 on every other rule.
  quorumN: Int!
  approvals: Int!
  required: Int!
}

# The name of the workflow that applies to a policy, so an author sees which one it is; null when
# none resolves. Proposed in steward-gateway#137, merged in steward-gateway#140 (the pinned copy
# moves past it with the next schema bump, and this goes then).
extend type EffectiveWorkflow {
  name: String
}

# The runs the caller has already decided that are still in review, proposed in
# https://github.com/Steward-GRC/steward-gateway/issues/68 (steward-workflow#45): the inbox's
# "In progress" group. The caller's own approved or rejected seats; one entry per run (the newest
# decision), newest first; a run that is published, rejected or withdrawn drops out, and so does a
# policy the caller can no longer read. decidedAt is RFC 3339.
extend type Query {
  decidedApprovals: [DecidedApproval!]!
}

type DecidedApproval {
  policyVersionId: ID!
  policyTitle: String!
  runId: String!
  currentStageIdx: Int!
  stageCount: Int!
  # "approved" or "rejected"
  decision: String!
  decidedAt: String!
}

# The in-app notification inbox and quiet hours, proposed in
# https://github.com/Steward-GRC/steward-gateway/issues/73 (the inbox) and
# https://github.com/Steward-GRC/steward-gateway/issues/74 (quiet hours). steward-obligations
# stores the notices. They move to the pinned copy once the gateway ships them. The live
# subscription that tells an open page a notice arrived is not here yet.
#
# Only the caller's own notices are ever returned. A notice carries the kind's category from the
# notification type catalog; needsAction splits the bell's "Needs action" and "Updates" tabs.
extend type Query {
  # Newest first. first defaults to 20 and must be at least 1; after is the endCursor of the
  # previous page (an unknown cursor is InvalidArgument).
  myNotifications(filter: NotificationFilter, first: Int, after: String): NotificationPage!
  # For the bell's badge.
  myUnreadNotificationCount: Int!
}

extend type Mutation {
  # Idempotent: a notice that is already read keeps its first readAt. Someone else's notice, or
  # an unknown id, is NotFound.
  markNotificationRead(id: ID!): Notification!
  # How many notices it marked.
  markAllNotificationsRead: Int!
  # Both start and end null clears the window; one without the other is NOTIFY_PREF_INVALID, so
  # is an hour outside [0,23], start equal to end, or a timezone that is not an IANA name.
  # timezone defaults to UTC.
  setQuietHours(start: Int, end: Int, timezone: String): NotificationSettings!
}

# Every field is optional and they combine. needsAction true is the "Needs action" tab, false the
# "Updates" tab, null both.
input NotificationFilter {
  needsAction: Boolean
  unread: Boolean
  category: NotifCategory
}

type NotificationPage {
  items: [Notification!]!
  # Null on the last page.
  endCursor: String
  hasMore: Boolean!
}

type Notification {
  id: ID!
  kind: String!
  category: NotifCategory!
  title: String!
  line: String!
  needsAction: Boolean!
  link: NotificationLink
  # RFC 3339.
  createdAt: String!
  # RFC 3339; null while unread.
  readAt: String
}

enum NotificationLinkKind {
  APPROVAL
  CASE
  POLICY
}

# What the notice opens: a policy number, an approval's policy version id, or a case id.
type NotificationLink {
  kind: NotificationLinkKind!
  ref: String!
}

# Quiet hours hold email and push; in-app notices are never held. Security and transactional
# notices, and any critical-severity one (policy-escalation), are not held either. High-severity
# compliance notices (ack-required, policy-ack-reminder, review-due) are held for email and push.
# Nothing is delivered late. start is
# the first hour held and end the first hour not held, both local hours in timezone; end below
# start is a window across midnight.
type QuietHours {
  start: Int!
  end: Int!
  timezone: String!
}

extend type NotificationSettings {
  quietHours: QuietHours
}

# When an acknowledgement is due, proposed in https://github.com/Steward-GRC/steward-gateway/issues/55
# and https://github.com/Steward-GRC/steward-gateway/issues/77 (steward-obligations#52 computes
# it): the publish time of the version to acknowledge plus ACK_DUE_DAYS (14 by default; 0 turns
# due dates off). ISO-8601, null when due dates are off or the version has no publish time. On a
# roster entry it is set for pending people only; on an overdue entry for every entry. These move
# to the pinned copy once the gateway ships them.
extend type Obligation {
  dueAt: String
}

extend type AckRosterEntry {
  dueAt: String
}

extend type OverdueEntry {
  dueAt: String
}

# The organisation's monthly limit on AI provider requests, proposed in
# https://github.com/Steward-GRC/steward-gateway/issues/85 and built in the gateway's
# feat/85-ai-settings-limit-notice branch. 0 means no limit. setAIMonthlyLimit is site admin only,
# like the other ai settings; a negative limit is InvalidArgument, 0 clears it, and it answers the
# limit now in force. Both move to the pinned copy (schema.graphql) once that gateway PR merges.
extend type AIConfig {
  "Provider requests allowed per calendar month (UTC); 0 means no limit."
  monthlyLimit: Int!
}

extend type Mutation {
  setAIMonthlyLimit(limit: Int!): Int!
}

# The signed-in person changes their own password, proposed in
# https://github.com/Steward-GRC/steward-gateway/issues/72 and answered by steward-identity's
# ChangeMyPassword (steward-identity#66). It acts for the caller only (refused while acting as
# someone) and checks the current password first. Refusals carry these codes in extensions.code:
# CURRENT_PASSWORD_WRONG, PASSWORD_TOO_WEAK (too short, breached or too like the identifier),
# NO_LOCAL_PASSWORD (an account that signs in through SSO) and PASSWORD_CHANGE_UNAVAILABLE (the
# sign-in service is down; the mock never answers it). This goes once the pinned gateway SDL
# carries it.
extend type Mutation {
  changeMyPassword(currentPassword: String!, newPassword: String!): Boolean!
}

# The platform group names of each person on the acknowledgement roster, for the "Approvers ·
# Finance team" column. Proposed in https://github.com/Steward-GRC/steward-gateway/issues/77 (open
# as steward-gateway#174). Sorted case-insensitively, then exactly; [] when the person has none.
# This goes once the pinned gateway SDL carries it.
extend type AckRosterEntry {
  groups: [String!]!
}

# The caller's own acknowledgements, named by their policy: the row of the "Recently acknowledged"
# card on My work. Proposed in https://github.com/Steward-GRC/steward-gateway/issues/56 (open as
# steward-gateway#172). Always the signed-in user's, never another person's, newest first. limit
# missing, zero or negative is 10; at most 100. Nothing acknowledged is []. This goes once the
# pinned gateway SDL carries it.
extend type Query {
  myAcknowledgments(limit: Int): [RecentAcknowledgment!]!
}

type RecentAcknowledgment {
  policyId: ID!
  number: String!
  title: String!
  versionNo: Int!
  policyVersionId: ID!
  # ISO-8601.
  ackedAt: String!
}

# The registry of issued magic links, proposed in https://github.com/Steward-GRC/steward-gateway/issues/71
# (steward-delivery#45 lists and removes them). Site admins only. magicLinks lists newest first;
# pageSize is 1 to 200 (default 50), pageToken is the opaque cursor from nextPageToken (null on
# the last page), a bad one answers INVALID_REQUEST with the field page_token. policyVersionIds
# filters to those versions. status is "active", "revoked" or "expired" (revoked wins over
# expired). The times are RFC 3339; revokedAt and revokedByUserId are null until revoked.
# removeMagicLink deletes a revoked or expired link: MAGIC_LINK_ACTIVE for an active one,
# MAGIC_LINK_NOT_FOUND for an unknown token.
extend type Query {
  magicLinks(policyVersionIds: [ID!], pageSize: Int, pageToken: String): MagicLinkPage!
}

extend type Mutation {
  removeMagicLink(token: String!): Boolean!
}

type MagicLinkPage {
  links: [MagicLinkInfo!]!
  nextPageToken: String
}

type MagicLinkInfo {
  token: String!
  fingerprint: String!
  policyVersionId: ID!
  createdByUserId: ID!
  sensitive: Boolean!
  status: String!
  createdAt: String!
  expiresAt: String!
  revokedAt: String
  revokedByUserId: ID
}
