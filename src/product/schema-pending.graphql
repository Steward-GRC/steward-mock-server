#
# Schema that's ahead of the gateway: read after schema.graphql, the pinned copy, so the clients
# can be built against it before steward-gateway ships it. It holds the shape proposed in
# https://github.com/Steward-GRC/steward-gateway/issues/41 (policy text search), and each part
# goes once the pinned gateway SDL carries it.

extend type Query {
  # searchPolicies -> core's search RPC over published policy text, filtered by the reader's read
  #   decision (steward-authz). A policy the viewer can't read never appears. A viewer whose
  #   content is obfuscated matches on title and number only and gets no snippet. Drafts and
  #   retired policies never match. documentType: null searches both kinds. first: page size
  #   (default 20, at most 100). after: the nextPageToken of the page before.
  searchPolicies(query: String!, documentType: DocumentType, first: Int, after: String): PolicySearchPage!
}

# One page of hits, best first, paged like AuditQueryPage and UserPage.
type PolicySearchPage {
  hits: [PolicySearchHit!]!
  # Opaque; pass as `after` for the next page. Empty on the last page.
  nextPageToken: String!
}

type PolicySearchHit {
  policy: Policy!
  # Higher is better. Only comparable within one search's results.
  rank: Float!
  # Null when the match is in the title or number only, or the viewer's content is obfuscated.
  snippet: PolicySearchSnippet
}

# A passage of the published text, plain (no markup), and where the query matched in it. A long
# passage is cut to a window around its first match, with an ellipsis (…) at a cut end.
type PolicySearchSnippet {
  text: String!
  matches: [TextSpan!]!
}

# A run of `text`, counted in UTF-16 code units, as JavaScript, NSString and Kotlin index strings.
type TextSpan {
  start: Int!
  length: Int!
}
