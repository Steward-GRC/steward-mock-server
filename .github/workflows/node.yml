# Node build and test for steward-mock-server. checks.yml calls it from its one
# `checks` job, so its status check is `checks / Build & Test`.
#
# Steps, in order: install with the lockfile and scripts off, lint, typecheck,
# the tests, then the mock started the way a person starts it, with its probes,
# its GraphQL endpoint and its controls page called over the network. It takes
# no secrets.
name: node

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: Job timeout.
        type: number
        default: 15

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Start the mock and call it
        run: |
          set -euo pipefail
          node bin/steward-mock-server.mjs --port 5180 > mock.log 2>&1 &
          for _ in $(seq 1 50); do curl -sf http://127.0.0.1:5180/livez > /dev/null && break; sleep 0.2; done
          curl -sf http://127.0.0.1:5180/readyz
          curl -sf http://127.0.0.1:5180/query -H 'content-type: application/json' \
            -d '{"query":"{ globalSettings { maintenance { enabled } } }"}' | grep -q '"globalSettings"'
          curl -sf http://127.0.0.1:5180/_mock | grep -q 'Mock controls'
          cat mock.log
